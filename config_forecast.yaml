    n_input: 24
    n_output: 6
    n_features: 512
    n_blocks: 8
    n_heads: 8
    n_features_head: 64
    n_rope_features: 32
    n_embedding: 512
    n_time_in: 1
    n_res_in: 1
    n_augment_in: 3
    mult: 2
    patch_size: 2
    dropout_mlp: 0.0
    lengthscale: 10
    long_skips: true

