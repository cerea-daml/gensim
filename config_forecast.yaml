  sampler:
    _target_: gensim.sampler.FlowMatchingSampler
    n_steps: 20
    schedule_scale: 3
    schedule_shift: 0.5
    second_order: true
    censoring: true

  _target_: gensim.forecast_module.GenSIMForecastModule
  _recursive_: false
  patching: true
  patch_size:
  - 64
  - 64
  overlap_size:
  - 8
  - 8

exp_name: gensim
logging_level: DEBUG
seed: 0
num_workers: 8
batch_size: 4
ckpt_path: null
compile: true
nodes: 1
devices: 8